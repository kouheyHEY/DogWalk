<?xml version="1.0" encoding="UTF-8"?>
<!--
  右向きの犬 — 64x64 グリッド、1セル=2px、出力 128x128
  白いドットのみ（目はネガティブスペース）
-->
<svg width="128" height="128" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- しっぽ（巻きカール、左後ろから上へ） -->
  <rect x="2" y="16" width="4" height="2" fill="white"/>
  <rect x="4" y="18" width="2" height="4" fill="white"/>
  <rect x="4" y="22" width="4" height="2" fill="white"/>
  <rect x="6" y="24" width="2" height="4" fill="white"/>

  <!-- 耳（とがり耳、頭の上） -->
  <rect x="46" y="10" width="2" height="2" fill="white"/>
  <rect x="45" y="12" width="4" height="2" fill="white"/>
  <rect x="44" y="14" width="6" height="2" fill="white"/>
  <rect x="43" y="16" width="8" height="2" fill="white"/>

  <!-- 頭（目の位置 x=50-51, y=22-23 をネガティブで空けている） -->
  <rect x="38" y="18" width="18" height="4" fill="white"/>
  <rect x="38" y="22" width="12" height="2" fill="white"/>
  <rect x="52" y="22" width="4" height="2" fill="white"/>
  <rect x="38" y="24" width="18" height="8" fill="white"/>

  <!-- マズル（鼻先、右に突き出し） -->
  <rect x="56" y="24" width="6" height="6" fill="white"/>

  <!-- 胴体 -->
  <rect x="6" y="28" width="36" height="12" fill="white"/>

  <!-- 後ろ足 2本 -->
  <rect x="8"  y="40" width="4" height="10" fill="white"/>
  <rect x="16" y="40" width="4" height="10" fill="white"/>

  <!-- 前足 2本 -->
  <rect x="26" y="40" width="4" height="10" fill="white"/>
  <rect x="34" y="40" width="4" height="10" fill="white"/>

  <!-- 肉球（足の下を少しだけ広げる） -->
  <rect x="6"  y="48" width="8" height="2" fill="white"/>
  <rect x="14" y="48" width="8" height="2" fill="white"/>
  <rect x="24" y="48" width="8" height="2" fill="white"/>
  <rect x="32" y="48" width="8" height="2" fill="white"/>
</svg>
